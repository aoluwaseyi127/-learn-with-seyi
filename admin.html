<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn with Seyi — Admin Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--accent:#6d5dfc;--good:#087443;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}main{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.num{font-size:29px;font-weight:800;margin-top:4px}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}.barline{display:flex;justify-content:space-between;gap:12px;margin:7px 0 5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;background:#fff;min-width:980px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px}th{background:#fafafa;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#667085}button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#eef0f4;color:#172033;font-weight:600}button.primary{background:var(--accent);color:#fff}button.danger{background:#fee2e2;color:#991b1b}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef0ff;font-size:12px;font-weight:700}.good{color:var(--good);font-weight:700}.empty{text-align:center;padding:35px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;width:min(900px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.examgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.exam{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.exam.pass{border-color:#b7e1c8;background:#f2fbf5}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0;font:inherit}@media(max-width:800px){main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.examgrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><b>Learn with Seyi · Admin</b><button id="logout">Log out</button></header>
<main>
  <h1>Student Dashboard</h1>
  <p class="muted">Monitor accounts, learning activity and progress. Passwords are never displayed.</p>
  <div class="grid" id="stats"></div>
  <section class="panel" style="margin-top:18px">
    <h2 style="margin-top:0">Students</h2>
    <input id="search" class="search" placeholder="Search by student name or email…">
    <div class="tablewrap"><table><thead><tr><th>Student</th><th>Progress</th><th>Quiz average (EN / FR)</th><th>Exams</th><th>XP</th><th>Placement</th><th>Last active</th><th></th></tr></thead><tbody id="users"></tbody></table></div>
  </section>
</main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div id="detailHead"></div><button onclick="closeDetail()">Close</button></div><div id="detail"></div></div></div>
<script src="/config.js"></script>
<script>
const token=(()=>{try{return JSON.parse(localStorage.getItem('lws_token'))}catch(e){return localStorage.getItem('lws_token')}})();if(!token)location.href='/';
const API=(window.LEARN_WITH_SEYI_API||'').replace(/\/$/,'');
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
const fmt=x=>x?new Date(x).toLocaleString():'Never';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[];
function renderUsers(){const q=document.querySelector('#search').value.trim().toLowerCase();const u=all.filter(x=>(x.name+' '+x.email).toLowerCase().includes(q));document.querySelector('#users').innerHTML=u.length?u.map(x=>{const s=x.summary||{};return `<tr><td><b>${esc(x.name)}</b><br><span class="muted small">${esc(x.email)}</span></td><td style="min-width:150px"><div class="barline"><span>${s.completion||0}%</span><span class="small muted">${s.modulesCompleted||0}/${s.modulesTotal||60} modules</span></div><div class="progress"><i style="width:${Math.min(100,s.completion||0)}%"></i></div></td><td><span class="pill">EN</span> ${(s.moduleScores?.en?.average||0)}%<br><span class="pill" style="margin-top:4px">FR</span> ${(s.moduleScores?.fr?.average||0)}%</td><td>${s.examsPassed||0}/${s.examsTaken||0} passed</td><td>⭐ ${s.xp||0}</td><td>${Object.entries(s.placement||{}).map(([k,v])=>`<span class="pill">${k.toUpperCase()}: ${esc(v)}</span>`).join(' ')||'—'}</td><td>${fmt(x.last_activity_at||x.last_login_at)}</td><td><button class="primary" onclick="detail('${x.id}')">View</button> <button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`}).join(''):`<tr><td colspan="8" class="empty">No students found.</td></tr>`}
async function load(){try{const s=await api('/api/admin/stats');document.querySelector('#stats').innerHTML=[['Students',s.total],['New today',s.today],['Active 7 days',s.active7d],['With progress',s.withProgress]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');all=await api('/api/admin/users');renderUsers()}catch(e){document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="panel" style="color:#b42318">${esc(e.message)}</div>`)}}
async function detail(id){try{const x=await api('/api/admin/users/'+id),s=x.summary||{};document.querySelector('#detailHead').innerHTML=`<h2 style="margin:0">${esc(x.name)}</h2><p class="muted" style="margin:4px 0">${esc(x.email)}</p>`;document.querySelector('#detail').innerHTML=`<div class="grid" style="margin-top:16px"><div class="card"><div class="muted">Overall progress</div><div class="num">${s.completion||0}%</div></div><div class="card"><div class="muted">XP</div><div class="num">⭐ ${s.xp||0}</div></div><div class="card"><div class="muted">Exams passed</div><div class="num">${s.examsPassed||0}</div></div><div class="card"><div class="muted">Writing saved</div><div class="num">${s.writingCompleted||0}</div></div></div><div class="cols" style="margin-top:14px"><div class="panel"><h3>Language progress</h3>${['en','fr'].map(k=>{const m=s.moduleScores?.[k]||{};return `<div style="margin:14px 0"><div class="barline"><b>${k==='en'?'English':'French'}</b><span>${m.average||0}% average</span></div><div class="progress"><i style="width:${Math.min(100,m.average||0)}%"></i></div><p class="small muted">${m.completed||0}/${m.total||30} modules completed · ${m.attempted||0} attempted</p></div>`}).join('')}</div><div class="panel"><h3>Account activity</h3><p><b>Joined:</b> ${fmt(x.created_at)}</p><p><b>Last login:</b> ${fmt(x.last_login_at)}</p><p><b>Last activity:</b> ${fmt(x.last_activity_at||x.last_login_at)}</p><p><b>Placement:</b> ${Object.entries(s.placement||{}).map(([k,v])=>`${k.toUpperCase()}: ${esc(v)}`).join(' · ')||'Not taken'}</p></div></div><div class="panel" style="margin-top:14px"><h3>Level exams</h3>${['en','fr'].map(k=>`<h4>${k==='en'?'English':'French'}</h4><div class="examgrid">${(s.examResults?.[k]||[]).map(e=>`<div class="exam ${e.passed?'pass':''}"><b>${e.level}</b><br>${e.score==null?'Not taken':e.score+'%'}<br>${e.passed?'✅ Passed':''}</div>`).join('')}</div>`).join('')}</div>`;document.querySelector('#modal').classList.add('open')}catch(e){alert(e.message)}}
function closeDetail(){document.querySelector('#modal').classList.remove('open')}
async function del(id){if(!confirm('Delete this student account and all saved progress?'))return;try{await api('/api/admin/users/'+id,{method:'DELETE'});await load()}catch(e){alert(e.message)}}
document.querySelector('#search').addEventListener('input',renderUsers);document.querySelector('#logout').onclick=()=>{localStorage.removeItem('lws_token');localStorage.removeItem('lws_lws_role');location.href='/'};load();
</script>
</body></html>
