<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linguelle Academy</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1b2430;--mut:#667085;--pri:#1f5eff;--acc:#ff6b4a;--ok:#12a150;--bad:#e5484d;--ln:#e6e3da}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#181e28;--ink:#eef1f6;--mut:#9aa4b5;--ln:#2a3342}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;overflow-x:hidden}img,video{max-width:100%;height:auto}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px}
.logo{font-weight:800;font-size:1.2rem;cursor:pointer;margin-right:auto}.logo span{color:var(--pri)}
nav,#usr{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;transition:.15s}
button:hover{border-color:var(--pri);transform:translateY(-1px)}nav button{border:0;background:none}nav button.on,.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.sm{padding:3px 9px}
main{max-width:960px;margin:0 auto;padding:24px 18px 70px}
.plan{text-align:center}.price{font-size:1.6rem;font-weight:800;color:var(--pri);margin:4px 0}.paybtn{display:inline-block;background:var(--pri);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700}.payp .box{max-width:700px;margin-left:auto;margin-right:auto}.payp select,.payp input{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit}.banktbl td{padding:4px 14px 4px 0}.lk{margin-left:6px}
.link{background:none;border:0;color:var(--pri);text-decoration:underline;padding:8px 4px;cursor:pointer;font:inherit}
body.authmode header{display:none}body.authmode main{padding-top:5vh}.authpage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh}.authbrand{text-align:center}.authbrand h1{font-size:2.1rem;margin:0 0 6px}.authbrand h1 span{color:var(--pri)}.authbrand p{margin:0;color:var(--mut)}
.hero{background:linear-gradient(135deg,var(--pri),#7b4dff 60%,var(--acc));color:#fff;border-radius:22px;padding:38px 28px}
.hero h1{margin:0 0 8px;font-size:2.2rem}.hero p{margin:0 0 18px;max-width:600px;opacity:.93}.hero button{border:0;color:var(--pri);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--pri);transform:translateY(-3px)}.card h3{margin:6px 0}.card p{margin:0;color:var(--mut);font-size:.92rem}
.ico{font-size:1.8rem}.badge{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.note{background:var(--card);border:1px dashed var(--pri);border-radius:14px;padding:12px 16px;margin:16px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}td,th{padding:9px 12px;border-bottom:1px solid var(--ln);text-align:left}th{color:var(--mut);font-size:.85rem}
.q,.box{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:24px;margin:12px 0}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.ex{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border-left:4px solid var(--pri)}
input{font:inherit;width:100%;padding:11px 13px;margin:6px 0;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink)}
.mut{color:var(--mut)}.err{color:var(--bad);min-height:1.4em}h2{margin-top:6px}ul{padding-left:20px}

/* ---------- PHONE / TOUCH RESPONSIVE LAYOUT ---------- */
@media (max-width:700px){
  body{font-size:15px}
  header{position:sticky;top:0;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));gap:7px;align-items:center}
  .logo{font-size:1.05rem;min-width:0;white-space:nowrap}
  #dir{font-size:.82rem;padding:8px 9px;white-space:nowrap}
  #xp{font-size:.78rem;padding:3px 8px;white-space:nowrap}
  nav{order:3;width:100%;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;min-height:40px;padding:8px 12px;white-space:nowrap}
  #usr{order:2;max-width:43%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  #usr::-webkit-scrollbar{display:none}
  #usr button{flex:0 0 auto;white-space:nowrap;padding:8px 10px}
  main{width:100%;max-width:none;margin:0;padding:16px 12px 56px}
  .hero{border-radius:16px;padding:24px 18px}
  .hero h1{font-size:1.75rem;line-height:1.2}
  .hero p{font-size:.95rem}
  .hero button{width:100%;margin:5px 0}
  .grid{grid-template-columns:1fr;gap:10px;margin:12px 0}
  .card{padding:15px;border-radius:14px;min-width:0}
  .card:hover{transform:none}
  .tabs{gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;min-height:42px;white-space:nowrap}
  button{min-height:44px;padding:9px 13px;touch-action:manipulation}
  button.sm{min-height:38px}
  .box,.q{padding:16px;border-radius:14px;margin:10px 0}
  .q h2{font-size:1.12rem;line-height:1.4}
  .opt{min-height:48px;margin:7px 0;padding:12px 13px}
  .note{padding:12px;margin:12px 0}
  .note button{margin:4px 2px}
  table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  td,th{padding:8px 9px}
  input,textarea,select{font-size:16px;max-width:100%}
  textarea{width:100%;resize:vertical}
  .err{font-size:.9rem}
  h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
  .bar{height:7px}
}
@media (max-width:390px){
  .logo{font-size:.98rem}
  #dir{font-size:.75rem;padding:7px 8px}
  #xp{font-size:.72rem}
  #usr{max-width:39%}
  main{padding-left:10px;padding-right:10px}
  .hero{padding:20px 15px}
  .hero h1{font-size:1.55rem}
  .box,.q{padding:14px}
}

const EXP={en:{
A1c:"<p>Le verbe <i>be</i> n'est jamais omis en anglais : <i>She is happy</i>, pas « She happy ». Contractions courantes : I'm, he's, they're.</p><p><b>Erreur fréquente :</b> « I have 20 years » ✗ → <i>I am 20 years old</i> ✓.</p>",
A1g:"<p>L'adjectif possessif s'accorde avec le <b>possesseur</b>, pas avec l'objet : <i>his mother</i> (la mère de lui), <i>her mother</i> (la mère d'elle).</p><p><b>Erreur fréquente :</b> « sa mère » est ambigu en français, jamais en anglais : choisissez his ou her.</p>",
A2c:"<p><i>Much / many</i> s'emploient surtout en questions et négations ; en affirmatif, préférez <i>a lot of</i>. <i>Some</i> sert aussi pour les offres (<i>Would you like some tea?</i>).</p><p><b>Erreur fréquente :</b> « many money » ✗ → <i>much money</i> ✓.</p>",
A2g:"<p>Au past simple, <i>be</i> devient <i>was/were</i>. Les autres verbes utilisent <i>did</i> (questions) ou <i>didn't</i> (négation) + verbe à la forme de base.</p><p><b>Erreur fréquente :</b> « Did you saw? » ✗ → <i>Did you see?</i> ✓.</p>",
B1c:"<p><i>At</i> + heure, <i>on</i> + jour/date, <i>in</i> + mois/année/saison. <i>For</i> = durée, <i>since</i> = point de départ.</p><p><b>Erreur fréquente :</b> « in Monday » ✗ → <i>on Monday</i> ✓.</p>",
B1g:"<p>Present perfect = <i>have/has</i> + participe passé : expérience (<i>I have been to Rome</i>), résultat, durée avec <i>for/since</i>. <i>Has</i> avec he/she/it.</p><p><b>Erreur fréquente :</b> « I am here since 2010 » ✗ → <i>I have been here since 2010</i> ✓.</p>",
B2c:"<p>Cond. 1 (réel) : <i>if</i> + présent, <i>will</i>. Cond. 2 (irréel) : <i>if</i> + prétérit, <i>would</i>. Jamais <i>will/would</i> juste après <i>if</i>. <i>Were</i> pour tous les sujets en style formel.</p><p><b>Erreur fréquente :</b> « If I would have time » ✗ → <i>If I had time</i> ✓.</p>",
B2g:"<p>Passif = <i>be</i> + participe passé ; be porte le temps : <i>was built</i>, <i>has been sent</i>, <i>is being repaired</i>. Utile quand l'agent est inconnu ou sans importance.</p><p><b>Erreur fréquente :</b> « It was happened » ✗ : <i>happen</i> n'a pas de passif.</p>",
C1c:"<p>L'inversion donne un style formel : <i>Had I known…</i>, <i>Should you need…</i>. Après un adverbe négatif en tête (<i>never, rarely, hardly, not only</i>), on inverse auxiliaire et sujet.</p><p><b>Erreur fréquente :</b> « Never I have seen » ✗ → <i>Never have I seen</i> ✓.</p>",
C1g:"<p>Déduction : <i>must</i> = quasi-certain, <i>might</i> = possible, <i>can't</i> = impossible. Au passé : modal + <i>have</i> + participe. <i>Should have</i> = reproche.</p><p><b>Erreur fréquente :</b> « He must to be » ✗ → <i>He must be</i> ✓.</p>",
x:"<p>Les verbes irréguliers n'ont pas de <i>-ed</i>. Le past simple décrit une action terminée (<i>I went to Paris in May</i>) ; le participe passé s'utilise avec <i>have/has</i> ou au passif (<i>I have gone</i>).</p><p><b>Astuce :</b> apprenez-les par familles (sing–sang–sung, drink–drank–drunk).</p>"},
fr:{
A1c:"<p>French nouns are masculine or feminine, so articles agree: <i>un garçon, une fille</i>. <i>Un/une</i> introduces something new; <i>le/la</i> something known or unique.</p><p><b>Common mistake:</b> *la soleil* ✗ → <i>le soleil</i> ✓. Learn each noun with its article.</p>",
A1g:"<p>Possessives agree with the noun owned: <i>mon père, ma mère, mes parents</i>. Before a vowel sound use <i>mon</i> even for feminine nouns: <i>mon amie, mon école</i>.</p><p><b>Common mistake:</b> *ma amie* ✗ → <i>mon amie</i> ✓.</p>",
A2c:"<p>The partitive means “some”: <i>du pain, de la soupe, de l'eau, des fruits</i>. After a negative it becomes <i>de/d'</i>: <i>Je ne mange pas de pain</i>.</p><p><b>Common mistake:</b> *Je bois l'eau* (meaning “some water”) ✗ → <i>de l'eau</i> ✓.</p>",
A2g:"<p><i>À</i> + cities, <i>en</i> + feminine countries (and vowels), <i>au</i> + masculine countries, <i>aux</i> + plural countries. <i>Au</i> = à + le; <i>aux</i> = à + les.</p><p><b>Common mistake:</b> *Je vais à France* ✗ → <i>en France</i> ✓.</p>",
B1c:"<p><i>Qui</i> = subject, <i>que</i> = direct object (elides to <i>qu'</i>), <i>dont</i> replaces <i>de + noun</i>, <i>où</i> = place or time.</p><p><b>Common mistake:</b> *le livre que j'ai besoin* ✗ → <i>dont j'ai besoin</i> ✓ (avoir besoin <b>de</b>).</p>",
B1g:"<p>Object pronouns go <b>before</b> the verb: <i>le/la/l'</i> for direct objects, <i>lui/leur</i> for people after <i>à</i>: <i>Je le vois, Je lui parle</i>.</p><p><b>Common mistake:</b> *Je parle lui* ✗ → <i>Je lui parle</i> ✓.</p>",
B2c:"<p>Subjunctive: doubt, wish, emotion, necessity, <i>bien que, pour que</i>. Indicative: certainty and facts (<i>je sais que, il est clair que</i>). <i>Soit</i> comes from <i>être</i>.</p><p><b>Common mistake:</b> *Bien qu'il est fatigué* ✗ → <i>bien qu'il soit fatigué</i> ✓.</p>",
B2g:"<p><i>Si + présent → futur</i> (real); <i>si + imparfait → conditionnel</i> (unreal). Never put the future or conditional right after <i>si</i>.</p><p><b>Common mistake:</b> *Si j'aurais le temps* ✗ → <i>Si j'avais le temps</i> ✓.</p>",
C1c:"<p><i>Malgré</i> + noun; <i>bien que / quoique / afin que / pourvu que</i> + subjunctive verb.</p><p><b>Common mistake:</b> *Malgré il pleut* ✗ → <i>malgré la pluie</i> or <i>bien qu'il pleuve</i> ✓.</p>",
C1g:"<p>The subjunctive stem usually comes from <i>ils</i>: <i>ils font → que je fasse</i>. Learn irregular roots (<i>fass-, puiss-, aill-, soi-</i>) and endings -e, -es, -e, -ions, -iez, -ent.</p><p><b>Common mistake:</b> *Il faut que tu fais* ✗ → <i>que tu fasses</i> ✓.</p>",
x:"<p>Each tense = a stem + endings. Learn <i>être, avoir, aller, faire</i> first: they are the most frequent and reappear in the future, subjunctive and conditional.</p><p><b>Tip:</b> say each table aloud with the pronouns, then test yourself in the practice tab.</p>"}};

const CLZ={en:{
A1:['The verb “to be”','Le verbe <b>be</b> : I <b>am</b> · he/she/it <b>is</b> · we/you/they <b>are</b>. Singulier (my mother, the book) → is ; pluriel (the cats, you and I) → are.','is,are,am,be','She ___ a teacher.|is;I ___ from France.|am;They ___ happy.|are;We ___ friends.|are;He ___ my brother.|is;You ___ late.|are;It ___ a big house.|is;I ___ tired.|am;The cats ___ black.|are;My mother ___ at home.|is;You and I ___ ready.|are;The book ___ on the table.|is;I ___ twenty years old.|am;The children ___ in the garden.|are;This ___ my phone.|is'],
A2:['Much, many, some, any','<b>Much</b> + indénombrable (water, time, money) ; <b>many</b> + dénombrable pluriel (friends, cars). <b>Some</b> en phrase affirmative ou offre, <b>any</b> en négation ou question.','much,many,some,any','How ___ water do you drink?|much;How ___ friends do you have?|many;I don\'t have ___ money.|any;There is ___ milk in the fridge.|some;Do you have ___ brothers?|any;We need ___ eggs for the cake.|some;How ___ time do we have?|much;She has too ___ books.|many;Would you like ___ tea?|some;He ate too ___ cake.|much;How ___ cars are there?|many;I can\'t see ___ people here.|any;There is ___ bread on the table.|some;How ___ is this shirt?|much;He didn\'t buy ___ apples.|any'],
B1:['Prepositions of time & place','<b>in</b> : mois, années, saisons, villes. <b>on</b> : jours, dates, surfaces. <b>at</b> : heures, lieux précis. <b>for</b> : durée (for two hours).','in,on,at,for','I live ___ Paris.|in;See you ___ Monday.|on;The class starts ___ nine o\'clock.|at;I\'ve lived here ___ five years.|for;We met ___ July.|in;She\'s ___ home now.|at;The book is ___ the table.|on;I\'ll call you ___ the evening.|in;We arrive ___ Friday morning.|on;He waited ___ two hours.|for;She was born ___ 1998.|in;Let\'s meet ___ noon.|at;The picture is ___ the wall.|on;I studied English ___ three years.|for;They travel ___ the summer.|in'],
B2:['Conditionals & wishes','Cond. 1 : if + présent, <b>will</b>. Cond. 2 : if + prétérit, <b>would</b>. Après if/wish on utilise <b>were</b> pour tous les sujets ; <b>had</b> pour exprimer le regret.','had,will,would,were','If I ___ more time, I would travel.|had;If it rains, we ___ stay home.|will;If she studied more, she ___ pass.|would;I wish I ___ more money.|had;If I ___ you, I\'d apologise.|were;If he comes, I ___ be happy.|will;I\'d go if I ___ time.|had;If I were rich, I ___ buy a boat.|would;Unless you hurry, you ___ miss the train.|will;She\'d help if she ___ able.|were;If it ___ sunny, we would go out.|were;They would come if they ___ the address.|had;If you call, he ___ answer.|will;What ___ you do if you won the lottery?|would;If I ___ taller, I\'d play basketball.|were'],
C1:['Inversion & formal structures','<b>Had / Were / Should</b> + sujet remplace if : <b>Had I known</b> = If I had known. Après never, hardly, little, not only : auxiliaire avant le sujet (<b>did</b> she, <b>had</b> we).','had,were,should,did','___ I known, I would have helped.|had;___ he arrive late, start without him.|should;___ I you, I\'d refuse.|were;Not only ___ she sing, she also danced.|did;Little ___ he know about the plan.|did;___ you need help, call me.|should;___ she told me, I would have come.|had;___ it not for you, I\'d have failed.|were;Hardly ___ we left when it began to rain.|had;No sooner ___ she sat than the phone rang.|had;Under no circumstances ___ you open it.|should;___ anyone ask, say I\'m out.|should;Rarely ___ she miss a class.|did;___ I a millionaire, I\'d travel.|were;___ they known the truth, they\'d have left.|had']},
fr:{
A1:['Articles: un, une, le, la','<b>un/une</b> = “a” (indefinite); <b>le/la</b> = “the” (definite). Masculine → un/le; feminine → une/la. Use un/une after “il y a” and “c\'est”; use le/la with a known owner (la voiture de mon père).','un,une,le,la','Il y a ___ chat dans la cuisine.|un;Il y a ___ fille dans le jardin.|une;___ soleil brille.|le;___ lune est belle.|la;Elle a ___ sœur.|une;J\'ai ___ frère.|un;___ garçon de ma classe est grand.|le;___ femme de Paul est gentille.|la;C\'est ___ ordinateur.|un;C\'est ___ maison.|une;___ livre de Marie est ici.|le;___ voiture de mon père est rapide.|la;Il y a ___ pomme sur la table.|une;Il y a ___ cahier sur la table.|un;___ porte de la classe est ouverte.|la'],
A2:['Partitive articles','Partitive articles mean “some”: <b>du</b> (masculine), <b>de la</b> (feminine), <b>de l\'</b> (before a vowel), <b>des</b> (plural).','du,de la,des,de l\'','Je bois ___ eau.|de l\';Elle mange ___ pain.|du;Il achète ___ pommes.|des;Nous voulons ___ salade.|de la;Tu prends ___ café ?|du;Je mange ___ fromage.|du;Ils boivent ___ lait.|du;Elle cherche ___ eau minérale.|de l\';Tu veux ___ soupe ?|de la;J\'achète ___ fruits.|des;Il y a ___ confiture sur la table.|de la;Je prends ___ jus d\'orange.|du;Nous mangeons ___ légumes.|des;Elle ajoute ___ huile.|de l\';On veut ___ glace.|de la'],
B1:['Relative pronouns','<b>qui</b> = subject; <b>que</b> = direct object; <b>dont</b> = replaces “de + noun”; <b>où</b> = place or time.','qui,que,dont,où','La ville ___ je suis né est belle.|où;Le livre ___ tu lis est long.|que;L\'homme ___ parle est mon père.|qui;Le film ___ je parle est nouveau.|dont;C\'est le café ___ nous avons mangé.|où;La fille ___ tu vois est ma sœur.|que;Voici l\'ami ___ habite à Lyon.|qui;Le stylo ___ j\'ai besoin est ici.|dont;Le jour ___ je suis arrivé, il pleuvait.|où;Les amis ___ je t\'ai présentés sont gentils.|que;Le professeur ___ enseigne le français est drôle.|qui;La maison ___ elle rêve est grande.|dont;Le pays ___ il habite est chaud.|où;Le chat ___ dort est à moi.|qui;La chanson ___ j\'écoute est ancienne.|que'],
B2:['Subjunctive vs indicative','Subjunctive (<b>soit</b>) after doubt, wish, emotion and bien que / il faut que. Indicative (<b>est, sera, était</b>) after certainty: je vois que, il est clair que.','soit,est,sera,était','Bien qu\'il ___ malade, il vient.|soit;Je suis content qu\'elle ___ ici.|soit;Il faut que ce ___ prêt demain.|soit;Je pense qu\'il ___ gentil.|est;Je sais qu\'elle ___ en retard.|est;Il est possible qu\'il ___ tard.|soit;Demain, il ___ là.|sera;Quoiqu\'elle ___ jeune, elle est sage.|soit;Je doute qu\'il ___ honnête.|soit;Il est clair qu\'il ___ fatigué.|est;Il est important que tout ___ clair.|soit;Il voulait que ce ___ simple.|soit;Autrefois, il ___ toujours en retard.|était;Il se peut que ce ___ vrai.|soit;Je vois qu\'elle ___ contente.|est'],
C1:['Advanced connectors','<b>Malgré</b> + noun (despite). <b>Bien que</b> (although), <b>afin que</b> (so that), <b>pourvu que</b> (provided that) + subjunctive.','malgré,bien que,afin que,pourvu que','___ la pluie, nous sortons.|malgré;___ tu sois fatigué, viens.|bien que;Je t\'aide ___ tu réussisses.|afin que;Nous irons ___ vous soyez d\'accord.|pourvu que;___ son âge, il court vite.|malgré;Je pars ___ vous ne me voyiez pas.|afin que;___ la fatigue, elle continue.|malgré;Il parle fort ___ nous l\'entendions.|afin que;___ elle soit jeune, elle est experte.|bien que;Tu peux sortir ___ tu rentres tôt.|pourvu que;___ le froid, ils ont marché.|malgré;Je t\'explique ___ tu comprennes.|afin que;___ vous soyez pressé, attendez.|bien que;Il viendra ___ vous l\'invitiez.|pourvu que;___ mes efforts, j\'ai échoué.|malgré']}};

function authExtra(){const e=esc(S.email||''),n=S.notice?`<p class="mut">${esc(S.notice)}</p>`:'',box=h=>`<div class="authpage"><div class="authbrand"><h1>Linguelle <span>Academy</span></h1><p>Learn English or French, from A1 to C1</p></div><div class="box" style="max-width:440px;width:100%;margin:12px auto">${h}</div></div>`;
if(S.tab=='forgot')return box(`<h3>Forgot your password?</h3><p class="mut">Enter your email and we will send you a 6-digit code.</p><input id="em" type="email" placeholder="Email" value="${e}"><div class="err" id="msg"></div><button class="pri" data-a="forgot">Send code</button> <button data-a="authv:login">Back</button>`);
if(S.tab=='verify')return box(`<h3>Confirm your email</h3><p class="mut">We sent a 6-digit code to <b>${e}</b>. Enter it below. If you cannot see the email, check your spam folder.</p>${n}<input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"><div class="err" id="msg"></div><button class="pri" data-a="verify">Confirm</button> <button data-a="resend:signup">Send a new code</button> <button data-a="authv:login">Back</button>`);
return box(`<h3>Choose a new password</h3><p class="mut">If <b>${e}</b> has an account, we sent a 6-digit code to it. Enter the code and your new password.</p>${n}<input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code"><input id="pw" type="password" placeholder="New password (6+ characters)"><input id="pw2" type="password" placeholder="Confirm new password"><div class="err" id="msg"></div><button class="pri" data-a="reset">Save new password</button> <button data-a="resend:reset">Send a new code</button> <button data-a="authv:login">Back</button>`)}
A.forgot=async()=>{const e=$('#em').value.trim().toLowerCase();if(!e)return msg('Enter your email.');try{await api('/api/forgot','POST',{email:e});go('auth',{tab:'reset',email:e})}catch(x){msg(x.message)}};
A.verify=async()=>{const c=$('#cd').value.trim();if(!c)return msg('Enter the 6-digit code.');try{await authDone(S.email,await api('/api/verify','POST',{email:S.email,code:c}))}catch(x){msg(x.message)}};
A.reset=async()=>{const c=$('#cd').value.trim(),p=$('#pw').value;if(!c)return msg('Enter the 6-digit code.');if(p.length<6)return msg('Password needs 6+ characters.');if(p!=$('#pw2').value)return msg('Passwords do not match.');try{await authDone(S.email,await api('/api/reset','POST',{email:S.email,code:c,password:p}))}catch(x){msg(x.message)}};
A.resend=async(purpose)=>{try{await api('/api/resend','POST',{email:S.email,purpose});note('A new code is on its way.')}catch(x){msg(x.message)}};
async function authDone(e,j){if(j&&j.registered)ls('reg_'+e,1);ls('session',e);ls('token',j.token);ls('lws_role',j.role||'student');const u=users();u[e]={name:j.name};ls('users',u);const sp=j.progress||{};if(Object.keys(sp).length)ls('p_'+e,sp);else{const g=ls('p_'+e)||ls('p_guest');if(g){ls('p_'+e,g);api('/api/progress','PUT',g).catch(()=>{})}}go('home')}
A.signup=async()=>{if(!ONLINE)return L0.s();const n=$('#nm').value.trim(),e=$('#em').value.trim().toLowerCase(),p=$('#pw').value;if(p!=$('#pw2').value)return msg('Passwords do not match.');try{await afterSignup(e,await api('/api/signup','POST',{name:n,email:e,password:p}))}catch(x){msg(x.message)}};
A.login=async()=>{if(!ONLINE)return L0.l();const e=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;try{await authDone(e,await api('/api/login','POST',{email:e,password:pw}))}catch(x){if(x.code=='UNVERIFIED')go('auth',{tab:'verify',email:e,notice:x.message});else if(x.code=='NOACCOUNT'&&users()[e]){try{L0.l();if(user()==e){const j=await api('/api/signup','POST',{name:users()[e].name,email:e,password:pw});ls('session',null);await afterSignup(e,j)}}catch(y){msg(y.message)}}else msg(x.message)}};
A.logout=async()=>{try{if(ONLINE&&ls('token'))await api('/api/logout','POST')}catch(e){}ls('token',null);ls('lws_role',null);L0.o()};
const PAY=()=>window.LWS_PAYMENTS||{};
const payOn=()=>!!(PAY().enabled&&window.LEARN_WITH_SEYI_SHEET);
let ACC={email:null,levels:[],until:null,ended:null,state:'idle'};
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
function hasLevel(l){return !payOn()||(ACC.email===user()&&(ACC.levels.includes('ALL')||ACC.levels.includes(l)))}
const lockTag=l=>payOn()&&user()&&!hasLevel(l)?'<span class="lk" title="Locked">🔒</span>':'';
function accessNote(){if(!payOn()||ACC.email!==user())return '';if(ACC.levels.length&&ACC.until)return `<p class="mut">✅ Full access until <b>${fmtDate(ACC.until)}</b>. Pay again before then to keep learning.</p>`;if(!ACC.levels.length&&ACC.ended)return `<p class="err">Your access ended on ${fmtDate(ACC.ended)}. Open any level to renew.</p>`;return ''}
function viewLevel(){if(['level','writing','write'].includes(S.v))return S.l;if(S.v=='topic'){const t=byId(S.id);return t&&t.l}return null}
async function refreshAccess(){
const e=user();if(!e||!payOn()||ACC.state=='checking')return;
const c=ls('acc_'+e),okc=!!(c&&Array.isArray(c.levels)&&Date.now()-(c.t||0)<6048e5);
ACC={email:e,levels:okc?c.levels:[],until:okc?c.until||null:null,ended:okc?c.ended||null:null,state:'checking'};
let r;
try{const res=await fetch(window.LEARN_WITH_SEYI_SHEET+'?action=status&email='+encodeURIComponent(e));r=await res.json();if(!Array.isArray(r.levels))throw 0;ls('acc_'+e,{levels:r.levels,until:r.until||null,ended:r.ended||null,t:Date.now()})}
catch(x){r=okc?{levels:c.levels,until:c.until,ended:c.ended}:{levels:[],error:true}}
if(user()!==e)return;
const same=okc&&JSON.stringify([c.levels,c.until||null,c.ended||null])==JSON.stringify([r.levels,r.until||null,r.ended||null]);
ACC={email:e,levels:r.levels,until:r.until||null,ended:r.ended||null,state:r.error?'error':'done'};
if(!same||S.v=='locked'||S.v=='levels')render()}
const LVN={A1:'Complete beginner (A1)',A2:'Elementary (A2)',B1:'Intermediate (B1)',B2:'Upper-intermediate (B2)',C1:'Advanced (C1)'};
VIEW.locked=()=>{const P_=PAY(),pl=P_.plan||{},e=user(),u=users()[e]||{};
if(ACC.state=='checking')return `<div class="box"><h2>Linguelle Academy</h2><p class="mut">Checking your access…</p></div>`;
const price=esc(pl.price||''),back='<p><button data-a="levels">← All levels</button></p>',saved=ls('regdata_'+e)||{};
if(!ls('reg_'+e)||S.edit){const v=k=>esc(saved[k]||'');
return `<div class="payp">${back}<div class="box"><h2>Register for Linguelle Academy</h2><p class="mut">Step 1 of 2 · Tell us about you. Next you will pay <b>${price}</b> for full access to every level, A1 to C1.</p>
<label class="mut">Full name</label><input id="rn" value="${esc(saved.name||u.name||'')}">
<label class="mut">Phone or WhatsApp number</label><input id="rp" type="tel" placeholder="+44 …" value="${v('phone')}">
<label class="mut">Country</label><input id="rc" value="${v('country')}">
<label class="mut">Language you want to learn</label><select id="rl">${['English','French','Both'].map(x=>`<option ${saved.language==x?'selected':''}>${x}</option>`).join('')}</select>
<label class="mut">Your current level</label><select id="rv">${Object.values(LVN).concat(['Not sure']).map(x=>`<option ${saved.level==x?'selected':''}>${x}</option>`).join('')}</select>
<label class="mut">Preferred days and times (with your time zone)</label><input id="ra" placeholder="e.g. weekday evenings, UK time" value="${v('times')}">
<label class="mut">Your goals, or anything we should know</label><textarea id="rg" rows="3" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit">${v('goals')}</textarea>
<label style="display:block;margin:10px 0"><input id="rk" type="checkbox" style="width:auto;margin-right:8px">I understand the price is ${price}.</label>
<div class="err" id="rmsg"></div><button class="pri" data-a="register">Continue to payment</button></div></div>`}
const bank=(P_.bank||[]).filter(r=>r[1]).map(r=>`<tr><td class="mut">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td></tr>`).join('');
const none=!pl.cardLink&&!bank;
return `<div class="payp">${back}
${ACC.state=='error'?'<div class="box"><p class="err">We could not check your access. Check your internet connection, then press “Check my access”.</p></div>':''}
${ACC.ended?`<div class="box"><p class="err">Your access ended on ${fmtDate(ACC.ended)}. Pay for another month below to continue.</p></div>`:''}
<div class="box plan"><div style="font-size:2rem">🔒</div><h2>${esc(pl.name||'Monthly access')}</h2><p class="mut">${esc(pl.description||'Full access to every level, A1 to C1')}</p><div class="price">${price}</div><p class="mut">Step 2 of 2 · Choose how to pay</p>${pl.cardLink?`<a class="paybtn" href="${esc(pl.cardLink)}" target="_blank" rel="noopener">💳 Pay by card</a>`:''}${none?'<p class="mut">Payment details are not set up yet.</p>':''}</div>
${bank?`<div class="box"><h3>🏦 Pay by bank transfer</h3><table class="banktbl">${bank}</table><p class="mut">${esc(P_.bankNote||'Use the email you signed up with as the payment reference.')}</p></div>`:''}
<div class="box"><h3>✅ Already paid?</h3><p class="mut">Tell us how you paid. We will unlock your account as soon as we confirm your payment. We match your payment using the name or reference you enter below.</p>
<select id="pm"><option>Card</option><option>Bank transfer</option></select>
<input id="pr" placeholder="Payment reference, or the name on the transfer"><div class="err" id="pmsg"></div>
<button class="pri" data-a="paid">I’ve paid</button> <button data-a="recheck">Check my access</button> <button class="link" data-a="editreg">Edit my details</button></div></div>`};
A.register=async()=>{const e=user(),m=$('#rmsg'),g=i=>$('#'+i).value.trim();
const d={name:g('rn'),phone:g('rp'),country:g('rc'),language:$('#rl').value,level:$('#rv').value,times:g('ra'),goals:g('rg')};
if(!d.name)return m.textContent='Please enter your name.';if(!d.phone)return m.textContent='Please enter a phone or WhatsApp number.';if(!d.country)return m.textContent='Please enter your country.';if(!$('#rk').checked)return m.textContent='Please tick the box to continue.';
m.textContent='';
try{if(ONLINE&&ls('token'))await api('/api/register','POST',d);else fetch(window.LEARN_WITH_SEYI_SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({type:'registration',email:e},d))}).catch(()=>{});
ls('reg_'+e,1);ls('regdata_'+e,d);S.edit=false;render()}catch(x){m.textContent=x.message}};
A.editreg=()=>{S.edit=true;render()};
A.paid=()=>{const e=user(),u=users()[e]||{},ref=$('#pr').value.trim(),m=$('#pmsg');
if(!ref){m.style.color='';m.textContent='Please add your payment reference or the name used for the payment.';return}
try{fetch(window.LEARN_WITH_SEYI_SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'payment',email:e,name:u.name||'',level:'ALL',method:$('#pm').value,ref})}).catch(()=>{})}catch(x){}
m.style.color='var(--ok)';m.textContent='Thank you! We will unlock your account once your payment is confirmed. Then press “Check my access”.'};
A.recheck=()=>{ACC={email:null,levels:[],until:null,ended:null,state:'idle'};render()};
{const ex=A.exam;A.exam=function(l){if(!hasLevel(l)){go('locked',{l});return}return ex.apply(this,arguments)}}
{const lo=A.logout;A.logout=async function(){ACC={email:null,levels:[],until:null,ended:null,state:'idle'};return lo.apply(this,arguments)}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,...r]=el.dataset.a.split(':');if(A[a])A[a](...r)});
render();
function summarize(p){p=p||{};const best=p.best||{},exam=p.exam||{},wr=p.wr||{},L=['en','fr'],V=['A1','A2','B1','B2','C1'],ms={};
L.forEach(l=>{const k=Object.keys(best).filter(x=>x.startsWith(l));ms[l]={completed:k.filter(x=>Number(best[x])>=50).length,average:k.length?Math.round(k.reduce((a,x)=>a+(Number(best[x])||0),0)/k.length):0}});
const all=L.flatMap(l=>Object.keys(best).filter(x=>x.startsWith(l))),done=all.filter(x=>Number(best[x])>=50).length,total=60,ex=L.flatMap(l=>V.map(v=>exam[l+v]));
return{xp:Number(p.xp||0),placement:p.lvl||{},modulesCompleted:done,modulesTotal:total,completion:Math.round(done/total*100),examsTaken:ex.filter(v=>v!=null).length,examsPassed:ex.filter(v=>Number(v)>=70).length,writingCompleted:Object.keys(wr).length,enAvg:ms.en.average,frAvg:ms.fr.average}}
function report(){const url=window.LEARN_WITH_SEYI_SHEET;if(!url||ONLINE)return;clearTimeout(report.t);report.t=setTimeout(()=>{try{const e=user();if(!e)return;const p=P(),u=users()[e]||{};fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({email:e,name:u.name||'',summary:summarize(p),progress:p})}).catch(()=>{})}catch(x){}},1500)}
['signup','login'].forEach(k=>{const o=A[k];A[k]=async function(){const r=await o.apply(this,arguments);report();return r}});
fetch(SHEETAPI?window.LEARN_WITH_SEYI_SHEET+'?action=ping':API+'/api/ping').then(r=>r.json()).then(j=>{if(j.ok){ONLINE=true;if(S.v=='auth')render()}}).catch(()=>{});
</script></body></html>
